[platformio]
default_envs = bluepill
src_dir = firmware
build_dir = build/stm32

[env:bluepill]
platform = ststm32@19.4.0
board = bluepill_f103c8
framework = stm32cube
build_type = debug
build_src_filter = +<controller/>
build_flags = -Wall -Wextra -Werror=return-type
monitor_speed = 115200
upload_protocol = stlink

[env:esp32]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
build_src_filter = +<bridge/>
build_flags = -Wall
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
