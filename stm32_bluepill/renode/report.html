<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>STM32 本地仿真证据</title>
<style>body{margin:0;background:#101b2c;color:#e4efff;font:16px system-ui}main{max-width:1050px;margin:32px auto;padding:24px}h1{font-size:28px}small,p{color:#aabdd4}section{background:#18273c;border:1px solid #31445e;border-radius:18px;padding:22px;margin:20px 0}svg{width:100%;height:290px}text{fill:#d9e7f7;font:16px system-ui}.wire{fill:none;stroke:#65baf0;stroke-width:4}button{background:#60c5f8;color:#102031;border:0;border-radius:8px;padding:10px 22px;cursor:pointer}input{width:65%;vertical-align:middle;margin:0 20px}pre{white-space:pre-wrap;font:15px monospace;color:#a9efc0}.tag{color:#8bedbe}#time{font-variant-numeric:tabular-nums}a{color:#69caff}</style>
<main><small>真实 ARM 固件 · Renode 1.17.0 · 无需账号</small><h1>STM32F103C8T6 本地仿真工作流</h1><p>自动编译 → 加载 ELF → 执行 Cortex-M3 → 注入 PB12 按键 → 检查 GPIO / LED / UART</p><section><b class="tag"><!--STATUS--></b><p>下方为本次执行记录的回放。拖动时间轴查看真实采样结果；此页面不执行单片机程序。</p>
<svg viewBox="0 0 950 270" role="img" aria-label="STM32 LED 与按键接线状态"><rect x="270" y="25" width="300" height="220" rx="15" fill="#224e6a" stroke="#83b8d3"/><text x="315" y="60">STM32 Blue Pill</text><text x="305" y="85">Cortex-M3 · 72 MHz</text><text x="290" y="130">PA0</text><text x="290" y="210">PB12</text><text x="450" y="130">PC13</text><path class="wire" d="M270 125H205L195 115L185 135L175 115L165 135L155 125H95V155M95 185V230H150"/><text x="155" y="90">330Ω</text><circle id="led" cx="95" cy="170" r="18" stroke="#9aead1" stroke-width="3"/><text x="25" y="255">外接 LED</text><path class="wire" d="M570 125H660"/><circle id="board" cx="680" cy="125" r="15"/><text x="725" y="130">板载低有效 LED</text><path class="wire" d="M270 205H205M180 205H100V230"/><path id="switch" d="M205 205L180 190" stroke="#ffc578" stroke-width="5"/><text x="40" y="205">MODE</text><text x="135" y="245">GND</text><text id="pins" x="620" y="205"></text></svg>
<button id="play">播放</button><input id="scrub" aria-label="回放时间" type="range" min="0" max="179" value="0"><span id="time"></span></section>
<section><b>本次真实 UART 输出</b><pre><!--SERIAL--></pre></section><p>Renode 验证数字逻辑和程序行为。330Ω 为接线示意；此模型不计算模拟电流，也不验证晶振启动时间。原 Wokwi 面包板工程仍保留。</p></main>
<script>const trace=/*TRACE*/[];let timer;const $=id=>document.getElementById(id);function draw(){if(!trace.length)return;let r=trace[+$('scrub').value];$('led').setAttribute('fill',r.led?'#53edab':'#18342e');$('board').setAttribute('fill',r.pc13?'#18342e':'#53edab');$('switch').setAttribute('d',r.pb12?'M205 205L180 190':'M205 205H180');$('pins').textContent=`PA0 ${r.pa0} · PC13 ${r.pc13} · PB12 ${r.pb12}`;$('time').textContent=r.t.toFixed(2)+' s'}$('scrub').max=Math.max(0,trace.length-1);$('scrub').oninput=draw;$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='播放';return}if(+$('scrub').value>=trace.length-1)$('scrub').value=0;$('play').textContent='暂停';timer=setInterval(()=>{if(+$('scrub').value>=trace.length-1){clearInterval(timer);timer=null;$('play').textContent='播放';return}$('scrub').value=+$('scrub').value+1;draw()},30)};draw();</script></html>
